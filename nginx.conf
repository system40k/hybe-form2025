# Nginx Configuration for Enterprise Production

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    # Basic Settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off; # Hide nginx version
    
    # Buffer sizes for security
    client_body_buffer_size 10K;
    client_header_buffer_size 1k;
    client_max_body_size 8k;
    large_client_header_buffers 2 1k;
    
    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=req_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    
    # Map for WebSocket support
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    
    # Security headers map
    map $sent_http_content_type $x_content_type_options {
        default "nosniff";
        ~*text/ "" ;
    }
    
    # Include mime types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Logging format with security fields
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';
    
    log_format security '$remote_addr - [$time_local] "$request" $status '
                        'risk_id=$request_id ua="$http_user_agent" '
                        'fwd="$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;
    
    # Main server block
    server {
        listen 80;
        listen [::]:80;
        server_name _;
        
        # Redirect HTTP to HTTPS (in production with SSL)
        return 301 https://$server_name$request_uri;
    }
    
    # HTTPS server block
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name localhost;
        
        # SSL Configuration (update paths in production)
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        
        # Modern SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        
        # OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;
        
        # Security Headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'self';" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        
        # Remove Server header
        more_clear_headers Server;
        
        # Root location - serve static files from Vite build
        location / {
            root /usr/share/nginx/html/dist;
            index index.html;
            
            # Try files for SPA routing
            try_files $uri $uri/ /index.html;
            
            # Apply rate limiting
            limit_req zone=req_limit burst=20 nodelay;
            limit_conn conn_limit 10;
            
            # Cache static assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                access_log off;
            }
        }
        
        # API proxy to Express app
        location /api/ {
            proxy_pass http://app:3000/;
            proxy_http_version 1.1;
            
            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            
            # Rate limiting for API
            limit_req zone=req_limit burst=10 nodelay;
            limit_conn conn_limit 5;
        }
        
        # OTP endpoints (more restrictive rate limiting)
        location /api/otp/ {
            proxy_pass http://app:3000/api/otp/;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Stricter rate limiting for OTP endpoints
            limit_req zone=req_limit burst=5 nodelay;
            limit_conn conn_limit 3;
        }
        
        # Health check endpoint (no rate limiting)
        location /health {
            proxy_pass http://app:3000/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            access_log off;
        }
        
        # Metrics endpoint (restrict to internal network)
        location /metrics {
            proxy_pass http://app:3000/metrics;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            
            # Only allow internal monitoring
            allow 172.28.0.0/16;
            deny all;
            
            auth_basic "Prometheus Metrics";
            auth_basic_user_file /etc/nginx/.metrics_password;
        }
        
        # Deny access to sensitive files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        location ~ /(env\.local|\.env|package\.json|package-lock\.json) {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        # Custom error pages
        error_page 400 /400.html;
        error_page 401 /401.html;
        error_page 403 /403.html;
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        
        location = /400.html {
            root /usr/share/nginx/html/errors;
            internal;
        }
        
        location = /401.html {
            root /usr/share/nginx/html/errors;
            internal;
        }
        
        location = /403.html {
            root /usr/share/nginx/html/errors;
            internal;
        }
        
        location = /404.html {
            root /usr/share/nginx/html/errors;
            internal;
        }
        
        location = /50x.html {
            root /usr/share/nginx/html/errors;
            internal;
        }
    }
}
