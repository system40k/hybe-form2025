# Prometheus Configuration for Enterprise Monitoring

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'hybe-form-monitor'
    environment: 'production'

# Alertmanager configuration (optional)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
      # - targets: ['alertmanager:9093']

# Rule files for alerts
rule_files:
  - '/etc/prometheus/alerts/*.yml'

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: /metrics
    scheme: http

  # Main application service
  - job_name: 'hybe-app'
    static_configs:
      - targets: ['app:3000']
    metrics_path: /metrics
    scheme: http
    scrape_interval: 10s
    scrape_timeout: 5s
    
    # Relabel to add meaningful labels
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+):\d+'
        replacement: '${1}'

  # PostgreSQL database monitoring
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:9187']
    metrics_path: /metrics
    scheme: http
    
    # Use postgres_exporter sidecar in production
    # For now, we'll monitor via application metrics

  # Redis monitoring
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:9121']
    metrics_path: /metrics
    scheme: http
    
    # Use redis_exporter sidecar in production

  # Nginx monitoring
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:9113']
    metrics_path: /metrics
    scheme: http
    
    # Enable nginx stub_status or use nginx-prometheus-exporter

  # Node exporter for host metrics (if running on bare metal/VMs)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    metrics_path: /metrics
    scheme: http

# Custom metric relabeling for cost optimization
# Drop high-cardinality metrics that aren't needed
metric_relabel_configs:
  - source_labels: [__name__]
    regex: 'go_.*'
    action: drop
  
  - source_labels: [__name__]
    regex: 'process_.*'
    action: keep
