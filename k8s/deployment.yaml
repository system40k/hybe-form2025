apiVersion: v1
kind: ConfigMap
metadata:
  name: hybe-form-config
  namespace: hybe-production
data:
  NODE_ENV: "production"
  PORT: "3000"
  LOG_LEVEL: "info"
  RATE_LIMIT_WINDOW_MS: "300000"
  RATE_LIMIT_MAX_REQUESTS: "3"
  IP_RATE_LIMIT_WINDOW_MS: "900000"
  IP_RATE_LIMIT_MAX_REQUESTS: "10"
  OTP_EXPIRY_MINUTES: "10"
  OTP_MAX_ATTEMPTS: "3"
  ALLOW_TEMP_EMAILS: "false"
  MAINTENANCE_MODE: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hybe-form-app
  namespace: hybe-production
  labels:
    app: hybe-form
    version: v1.0.0
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hybe-form
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: hybe-form
        version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: hybe-form-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: hybe-form
          image: <your-ecr-repo>/hybe-form:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: hybe-form-config
                  key: NODE_ENV
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: hybe-form-config
                  key: PORT
          envFrom:
            - secretRef:
                name: hybe-form-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - hybe-form
                topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: hybe-form-service
  namespace: hybe-production
  labels:
    app: hybe-form
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: hybe-form
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hybe-form-hpa
  namespace: hybe-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hybe-form-app
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hybe-form-ingress
  namespace: hybe-production
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "10"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  tls:
    - hosts:
        - your-domain.com
      secretName: hybe-form-tls
  rules:
    - host: your-domain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hybe-form-service
                port:
                  number: 80
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hybe-form-sa
  namespace: hybe-production
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hybe-form-role
  namespace: hybe-production
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hybe-form-rolebinding
  namespace: hybe-production
subjects:
  - kind: ServiceAccount
    name: hybe-form-sa
    namespace: hybe-production
roleRef:
  kind: Role
  name: hybe-form-role
  apiGroup: rbac.authorization.k8s.io
