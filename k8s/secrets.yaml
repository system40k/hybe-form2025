apiVersion: v1
kind: Secret
metadata:
  name: hybe-form-secrets
  namespace: hybe-production
type: Opaque
stringData:
  # Database connection (use external secrets manager in production)
  DATABASE_URL: "postgresql://hybe_user:CHANGE_ME_PASSWORD@postgres.hybe-db.svc.cluster.local:5432/hybe_db?sslmode=require"
  
  # Redis connection
  REDIS_URL: "redis://:CHANGE_ME_REDIS_PASSWORD@redis.hybe-cache.svc.cluster.local:6379"
  
  # Email service
  RESEND_API_KEY: "re_CHANGE_ME_RESEND_KEY"
  SENDGRID_API_KEY: "SG.CHANGE_ME_SENDGRID_KEY"
  
  # Security keys (generate with: openssl rand -hex 32)
  JWT_SECRET: "CHANGE_ME_32_BYTE_RANDOM_STRING_HEX"
  ENCRYPTION_KEY: "CHANGE_ME_32_BYTE_RANDOM_STRING_HEX"
  
  # Monitoring
  SENTRY_DSN: "https://CHANGE_ME@sentry.io/CHANGE_ME"
  DATADOG_API_KEY: "CHANGE_ME_DATADOG_KEY"
  
  # Redis password
  REDIS_PASSWORD: "CHANGE_ME_SECURE_REDIS_PASSWORD"

---
# Example for using External Secrets Operator (recommended for production)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hybe-form-external-secrets
  namespace: hybe-production
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: hybe-form-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: hybe-form/database
        property: url
    - secretKey: REDIS_URL
      remoteRef:
        key: hybe-form/redis
        property: url
    - secretKey: RESEND_API_KEY
      remoteRef:
        key: hybe-form/email
        property: resend_key
    - secretKey: JWT_SECRET
      remoteRef:
        key: hybe-form/security
        property: jwt_secret
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: hybe-form/security
        property: encryption_key
